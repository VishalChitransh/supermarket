services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "7860:7860"
    environment:
      MODEL_PATH: /app/backend_files/superkart_model.joblib
      PORT: "7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:7860
    depends_on:
      backend:
        condition: service_healthy
